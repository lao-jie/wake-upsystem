<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#3b82f6">
    <title>老街网创 · 登录</title>
    <link rel="stylesheet" href="login.css?v=20261026b">
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-brand">老街网创</h1>
            </div>

            <form class="auth-form" onsubmit="event.preventDefault();">
                <div class="auth-input-wrap">
                    <span class="auth-input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="text" id="uid" class="auth-input" placeholder="请输入账号" autocomplete="username">
                </div>

                <div class="auth-input-wrap">
                    <span class="auth-input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="pwd" class="auth-input" placeholder="请输入密码" autocomplete="current-password">
                </div>

                <label class="auth-terms">
                    <input type="checkbox" id="rememberMe" class="auth-checkbox">
                    记住账号密码
                </label>

                <button type="button" class="login-btn auth-submit-btn">登录</button>
            </form>
        </div>
    </div>

    <script src="vendor/supabase.js"></script>
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>

</html>
