<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#3b82f6">
    <title>老街网创 · 登录</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-bg" aria-hidden="true"></div>

    <main class="login-box" role="main">
        <header class="login-header">
            <div class="login-brand">老街网创</div>
            <h1 class="login-title">欢迎登录</h1>
            <p class="login-desc">员工工作台</p>
        </header>

        <div class="input-item">
            <label class="input-label" for="uid">账号</label>
            <input type="text" id="uid" placeholder="请输入员工账号" autocomplete="username">
        </div>
        <div class="input-item">
            <label class="input-label" for="pwd">密码</label>
            <input type="password" id="pwd" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="input-item remember-row">
            <input type="checkbox" id="rememberMe" class="remember-checkbox">
            <label for="rememberMe" class="remember-label">记住账号密码</label>
        </div>
        <button type="button" class="login-btn">登录系统</button>
        <p class="tip">暂不支持注册</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>

</html>
