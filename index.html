<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#3b82f6">
    <title>老街网创 · 登录</title>
    <link rel="stylesheet" href="login.css?v=20261026reg">
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-brand">老街网创</h1>
            </div>

            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">登录</button>
                <button type="button" class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">注册</button>
            </div>

            <form class="auth-form" id="loginForm" onsubmit="event.preventDefault();">
                <div class="auth-input-wrap">
                    <span class="auth-input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="text" id="uid" class="auth-input" placeholder="请输入账号" autocomplete="username">
                </div>

                <div class="auth-input-wrap">
                    <span class="auth-input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="pwd" class="auth-input" placeholder="请输入密码" autocomplete="current-password">
                </div>

                <label class="auth-terms">
                    <input type="checkbox" id="rememberMe" class="auth-checkbox">
                    记住账号密码
                </label>

                <button type="button" class="login-btn auth-submit-btn" id="loginBtn">登录</button>
            </form>

            <form class="auth-form" id="registerForm" style="display:none;" onsubmit="event.preventDefault();">
                <div class="auth-input-wrap">
                    <span class="auth-input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="text" id="regName" class="auth-input" placeholder="昵称" maxlength="32" autocomplete="nickname">
                </div>

                <div class="auth-input-wrap">
                    <span class="auth-input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </span>
                    <input type="text" id="regUser" class="auth-input" placeholder="QQ号（账号，验证码发到QQ邮箱）" inputmode="numeric" autocomplete="username">
                </div>

                <div class="auth-code-row">
                    <div class="auth-input-wrap auth-code-input">
                        <span class="auth-input-icon" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="text" id="regCode" class="auth-input" placeholder="邮箱验证码" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                    </div>
                    <button type="button" class="auth-code-btn" id="sendCodeBtn" onclick="sendRegisterCode()">获取验证码</button>
                </div>

                <div class="auth-input-wrap">
                    <span class="auth-input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="regPass" class="auth-input" placeholder="密码（至少6位）" autocomplete="new-password">
                </div>

                <div class="auth-input-wrap">
                    <span class="auth-input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                    </span>
                    <input type="text" id="regInvite" class="auth-input" placeholder="邀请码" autocomplete="off">
                </div>

                <button type="button" class="login-btn auth-submit-btn" id="registerBtn" onclick="submitRegister()">注册</button>
                <p class="auth-hint">验证码将发送到 QQ号@qq.com，请先开通 QQ 邮箱</p>
            </form>
        </div>
    </div>

    <script src="db-client.js?v=20261026m4"></script>
    <script src="config.js?v=20261026m4"></script>
    <script src="login.js?v=20261026reg"></script>
</body>

</html>
