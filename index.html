<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="theme-color" content="#3b82f6">
    <title>老街网创</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="login-box">
        <h1 class="login-brand">老街网创</h1>

        <div class="input-item">
            <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="8" r="3.5"></circle>
                    <path d="M5.5 19.5c1.8-3.2 4.2-4.5 6.5-4.5s4.7 1.3 6.5 4.5"></path>
                </svg>
            </span>
            <input type="text" id="uid" placeholder="请输入账号" autocomplete="username">
        </div>

        <div class="input-item">
            <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                    <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
            </span>
            <input type="password" id="pwd" placeholder="请输入密码" autocomplete="current-password">
        </div>

        <div class="remember-row">
            <input type="checkbox" id="rememberMe" class="remember-checkbox">
            <label for="rememberMe" class="remember-label">记住账号密码</label>
        </div>

        <button type="button" class="login-btn">登录</button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>

</html>
